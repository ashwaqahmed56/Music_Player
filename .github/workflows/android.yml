          cat > plugins/yt-bgr/dist/esm/index.d.ts <<'YTBGR_DTS_EOF'
          import { registerPlugin } from '@capacitor/core';

          export interface YtOpenOptions { url?: string; desktopUa?: boolean; }
          export interface YtStateEvent {
            state: 'idle' | 'playing' | 'paused' | 'buffering' | 'ended';
            position: number;
            duration: number;
          }
          export interface YtMetaEvent { title: string; artist: string; artwork: string; videoId: string; }
          export interface YtErrorEvent { reason: string; }
          export interface YtListenerHandle { remove(): Promise<void>; }

          export interface YtBgrPlugin {
            open(options?: YtOpenOptions): Promise<void>;
            close(): Promise<void>;
            play(): Promise<void>;
            pause(): Promise<void>;
            seekTo(options: { sec: number }): Promise<void>;
            loadUrl(options: { url: string }): Promise<void>;
            isActive(): Promise<{ active: boolean }>;
            addListener(cb: 'ytState', fn: (e: YtStateEvent) => void): Promise<YtListenerHandle>;
            addListener(cb: 'ytMeta', fn: (e: YtMetaEvent) => void): Promise<YtListenerHandle>;
            addListener(cb: 'ytError', fn: (e: YtErrorEvent) => void): Promise<YtListenerHandle>;
            removeAllListeners(): Promise<void>;
          }

          export declare const YtBgr: YtBgrPlugin;
          YTBGR_DTS_EOF

          # Make sure package.json references the generated plugin
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.dependencies = p.dependencies || {};
            p.dependencies['ashs-yt-bgr'] = 'file:plugins/yt-bgr';
            fs.writeFileSync('package.json', JSON.stringify(p,null,2));
            console.log('yt-bgr dependency registered');
          "
          echo "yt-bgr source generated"

      - name: Re-install (picks up the generated plugin)
        run: |
          npm install --no-audit --no-fund

      - name: Stage web assets (keeps node_modules OUT of the APK)
        run: |
          mkdir -p www
          cp index.html styles.css app.js ytbgr.js online.js manifest.json sw.js icon.svg icon-192.png icon-512.png www/
          mkdir -p www/providers
          cp providers/types.js providers/config.js providers/searchCache.js providers/youtube.js providers/audius.js providers/archive.js providers/index.js providers/player.js www/providers/
          cp .nojekyll www/ 2>/dev/null || true

      - name: Add + sync Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Generate launcher icons + splash from assets/icon.png
        run: |
          npx @capacitor/assets generate --android --iconBackgroundColor '#FFF3E0' --iconBackgroundColorDark '#1e120b' --splashBackgroundColor '#1e120b' --splashBackgroundColorDark '#0b100c'

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ashs-Player-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
