name: Build Ash's Player APK (standalone, offline)

# Free cloud build: every push + manual runs compile a real native APK with
# your app files bundled INSIDE (no website loading, works offline).
#
# The app is audio-only - no video, no embed players and no custom native
# plugins to build here. Lyrics come from lrclib; streaming code was removed.
on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'sw.js'
      - 'manifest.json'
      - 'icon*.png'
      - 'icon.svg'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'plugins/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          if [ ! -f plugins/media-library/package.json ]; then
            echo "WARNING: plugins/media-library missing from repo - building without device-scan plugin"
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete (p.dependencies||{})['ashs-media-library'];fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          else
            echo "Local media plugin present"
          fi
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Verify project files
        run: |
          missing=0
          for f in package.json package-lock.json capacitor.config.json index.html styles.css app.js sw.js; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f — it was never committed/pushed. Upload it to the repo root and re-run."
              missing=1
            fi
          done
          for d in plugins; do
            if [ ! -d "$d" ]; then
              echo "::error::Missing required folder: $d/ — it was never committed/pushed. Upload it and re-run."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo ""
            echo "Fix locally with:  git add -A && git commit -m 'add missing files' && git push"
            exit 1
          fi

      - name: Syntax-check web scripts
        run: |
          if [ -f scripts/check.mjs ]; then
            node scripts/check.mjs
          else
            echo "WARNING: scripts/check.mjs missing from repo - skipping syntax check"
          fi

      - name: Stage web assets (keeps node_modules OUT of the APK)
        run: |
          set -e
          mkdir -p www
          for f in index.html styles.css app.js manifest.json sw.js icon.svg icon-192.png icon-512.png; do
            if [ -f "$f" ]; then cp "$f" www/; else echo "WARNING: missing $f (skipped)"; fi
          done
          cp .nojekyll www/ 2>/dev/null || true
          echo "--- staged web assets ---" && ls -1 www

      - name: Add + sync Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Pin stable debug signing key (updates install over old builds)
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp -f debug.keystore ~/.android/debug.keystore
            cp -f debug.keystore android/app/debug.keystore
            echo "Pinned debug keystore in place - new APKs install over previous ones"
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1
            cp -f debug.keystore ~/.android/debug.keystore
            cp -f debug.keystore android/app/debug.keystore
            echo "Repo had no debug.keystore - auto-created and committed it"
            git config user.name "ashs-player-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Pin stable debug signing key (auto)" || echo "nothing to commit"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}" \
              || echo "WARNING: could not push the keystore - future builds will use a fresh key (manual upload once needed)"
          fi

      - name: Generate launcher icons + splash from assets/icon.png
        run: |
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --android --iconBackgroundColor '#FFF3E0' --iconBackgroundColorDark '#1e120b' --splashBackgroundColor '#1e120b' --splashBackgroundColorDark '#0b100c'
          else
            echo "assets/icon.png missing - using the bundled launcher icons as-is"
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ashs-Player-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
