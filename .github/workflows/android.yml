name: Build Nova APK (standalone, offline)

# Free cloud build: every push + manual runs compile a real native APK
# with your app files bundled INSIDE (no website loading, works offline).
on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Stage web assets (keeps node_modules OUT of the APK)
        run: |
          mkdir -p www
          cp index.html styles.css app.js manifest.json sw.js icon.svg icon-192.png icon-512.png www/
          cp -r .well-known www/ 2>/dev/null || true

      - name: Add + sync Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
