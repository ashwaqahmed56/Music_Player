<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a241c"/>
      <stop offset="1" stop-color="#0b100c"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26332a"/>
      <stop offset="1" stop-color="#10160f"/>
    </linearGradient>
    <radialGradient id="lbl" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#ffd97a"/>
      <stop offset="1" stop-color="#d98f1f"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
