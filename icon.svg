  <circle cx="256" cy="248" r="126" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="256" cy="248" r="104" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="256" cy="248" r="82" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="256" cy="248" r="56" fill="url(#lbl)"/>
  <circle cx="256" cy="248" r="56" fill="none" stroke="#7a4d0d" stroke-opacity=".6" stroke-width="2"/>
  <circle cx="256" cy="248" r="14" fill="#0b100c" stroke="#ffe9c4" stroke-opacity=".7" stroke-width="2"/>
  <g clip-path="url(#disc)">
    <rect x="120" y="40" width="70" height="420" rx="35" fill="#ffffff" opacity=".10" transform="rotate(18 256 248)"/>
