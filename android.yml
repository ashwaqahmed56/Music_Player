name: Build Ash's Player APK (standalone, offline)

# Free cloud build: every push + manual runs compile a real native APK
# with your app files bundled INSIDE (no website loading, works offline).
on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'plugins/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          if [ ! -f plugins/media-library/package.json ]; then
            echo "WARNING: plugins/media-library missing from repo — building without device-scan plugin"
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete (p.dependencies||{})['ashs-media-library'];fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          else
            echo "Local media plugin present"
          fi
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Stage web assets (keeps node_modules OUT of the APK)
        run: |
          mkdir -p www
          cp index.html styles.css app.js manifest.json sw.js icon.svg icon-192.png icon-512.png www/
          cp .nojekyll www/ 2>/dev/null || true
          cp -r .well-known www/ 2>/dev/null || true

      - name: Add + sync Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ashs-Player-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
